[project]
name = "lorecraft3000"
version = "0.1.0"
description = "Locally hosted comic-panel generator with persistent character identity."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.20.0",
    "openai>=1.40.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
identity = [
    "insightface>=1.0.1",
    "onnxruntime>=1.19.0",
]

[tool.uv]
# Script-based project: uv sync installs dependencies only, no package build.
package = false

[tool.pytest.ini_options]
markers = [
    "live: paid integration test; skipped unless explicitly enabled",
]
