{% extends "base.html" %}
{% block title %}Styles — LoreCraft3000{% endblock %}
{% block content %}
<h1>Styles</h1>
<p><a class="button" href="/styles/new">New style</a></p>

{% if styles %}
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Style contract</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for s in styles %}
    <tr>
      <td>{{ s.name }}</td>
      <td>{{ s.style_contract }}</td>
      <td><a href="/styles/{{ s.id }}/edit">Edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="muted">No styles yet.</p>
{% endif %}
{% endblock %}
